name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [21]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      - name: Build and Run Tests
        run: mvn clean verify -B

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: VaiComTudo/frontend
          path: frontend
          token: ${{ secrets.FRONTEND_ACCESS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Start Frontend Server in Background
        working-directory: ./frontend
        run: nohup npm run dev &

      - name: Wait for Frontend to be Ready
        run: |
          echo "Waiting for frontend to start..."
          for i in {1..60}; do
            if curl -s http://localhost:5173 > /dev/null; then
              echo "Frontend is ready at http://localhost:5173"
              exit 0
            fi
            echo "  Attempt $i/60 - waiting..."
            sleep 2
          done
          echo "Frontend failed to start within 120 seconds"
          exit 1

      - name: Run Cucumber E2E Tests
        run: mvn test -Dtest=CucumberTestRunner

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud Scan
        if: matrix.java-version == '21'
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Quality Gate Check
        if: matrix.java-version == '21'
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Add Coverage to PR
        if: github.event_name == 'pull_request' && matrix.java-version == '21'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: |
            ${{ github.workspace }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80

      - name: Import test results to Xray
        uses: mikepenz/xray-action@v3
        with:
          username: ${{ secrets.XRAY_CLIENT_ID }}
          password: ${{ secrets.XRAY_CLIENT_SECRET }}
          testFormat: "junit"
          testPaths: "**/TEST-junit-jupiter.xml"
          testExecKey: "VCT-62"
          projectKey: "VCT"
