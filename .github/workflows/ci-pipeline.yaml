name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [21]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      - name: Build and Run Tests
        run: mvn clean verify -B

      - name: Determine frontend ref (use head ref or fallback to dev)
        id: determine_frontend_ref
        run: |
          # Set initial target from the workflow context
          echo "TARGET_REF=${{ github.head_ref || github.ref_name }}" >> $GITHUB_ENV
          echo "Checking remote for branch $TARGET_REF..."
          # Check remote branch existence using the access token
          if git ls-remote --heads https://x-access-token:${{ secrets.FRONTEND_ACCESS_TOKEN }}@github.com/VaiComTudo/frontend.git "$TARGET_REF" | grep -q "$TARGET_REF"; then
            echo "Found branch $TARGET_REF, using it."
          else
            echo "Branch $TARGET_REF not found in remote; falling back to 'dev'."
            echo "TARGET_REF=dev" >> $GITHUB_ENV
          fi

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: VaiComTudo/frontend
          ref: ${{ env.TARGET_REF }}
          path: frontend
          token: ${{ secrets.FRONTEND_ACCESS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Start Frontend Server
        working-directory: ./frontend
        run: |
          npm run dev &
          npx wait-on http://localhost:5173 --timeout 60000
        env:
          VITE_API_BASE_URL: http://localhost:8080/api/v1

      - name: Run Cucumber E2E Tests
        run: mvn test -Dtest=CucumberTestRunner

      - name: Import Cucumber Results to Xray
        if: success() || failure()
        run: |
          chmod +x scripts/import-cucumber-results.sh
          ./scripts/import-cucumber-results.sh target/cucumber.json
        env:
          XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
          XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud Scan
        if: matrix.java-version == '21'
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Quality Gate Check
        if: matrix.java-version == '21'
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Add Coverage to PR
        if: github.event_name == 'pull_request' && matrix.java-version == '21'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: |
            ${{ github.workspace }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80

      - name: Import test results to Xray (excluding Cucumber)
        if: success() || failure()
        uses: mikepenz/xray-action@v3
        with:
          username: ${{ secrets.XRAY_CLIENT_ID }}
          password: ${{ secrets.XRAY_CLIENT_SECRET }}
          testFormat: "junit"
          testPaths: "**/surefire-reports/TEST-*.xml"
          testExecKey: "VCT-62"
          testPlanKey: "VCT-61"
          projectKey: "VCT"
